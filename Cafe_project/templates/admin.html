<!DOCTYPE html>
<html>

<head>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="navbar">

<h2>Admin Dashboard</h2>

<a href="/menu_page">Back</a>

</div>

<div class="cart">

<h2>All Orders</h2>

<table>

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Total</th>
<th>Date</th>
</tr>

{% for o in orders %}

<tr>
<td>{{o.order_id}}</td>
<td>{{o.customer_id}}</td>
<td>{{o.total_amount}}</td>
<td>{{o.order_date}}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
